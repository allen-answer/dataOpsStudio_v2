# R2 红线(契约 §4):getattr(obj, "old_password") 等 literal 属性名同样受检。
# FIELD 必须是 string AST,所以 getattr(obj, dynamic_key) 不会被误报或承诺覆盖。
id: r2-no-plaintext-prefixed-credential-getattr-access
language: python
severity: error
message: |
  R2 红线违规:getattr 直接访问带前缀的明文凭据属性。
  请在边界立即 verify/hash/store/reveal,必要边界使用带 rule id 的逐行 suppression。
files:
  - "app/**/*.py"
ignores:
  - "app/dbclients/**/*.py"
  - "app/infrastructure/secretstore/**/*.py"
  - "app/infrastructure/bootstrap/**/*.py"
rule:
  all:
    - pattern: getattr($X, $FIELD)
    - not:
        any:
          - pattern: getattr($X, "clear_api_key")
          - pattern: getattr($X, "has_stored_api_key")
constraints:
  FIELD:
    kind: string
    regex: '^["''][a-z][a-z0-9_]+_(password|passwd|pwd|api_key|token)["'']$'
