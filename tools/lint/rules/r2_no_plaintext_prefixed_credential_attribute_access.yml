# R2 红线(契约 §4):拦截 old_password / smtp_password / access_token 等
# 带语义前缀的明文凭据属性。精确字段 password/api_key/token 等由主 R2 规则覆盖。
# clear_api_key / has_stored_api_key 是控制/状态字段,不是明文凭据。
id: r2-no-plaintext-prefixed-credential-attribute-access
language: python
severity: error
message: |
  R2 红线违规:业务代码直接访问带前缀的明文凭据属性。
  请在边界立即 verify/hash/store/reveal,必要边界使用带 rule id 的逐行 suppression。
files:
  - "app/**/*.py"
ignores:
  - "app/dbclients/**/*.py"
  - "app/infrastructure/secretstore/**/*.py"
  - "app/infrastructure/bootstrap/**/*.py"
rule:
  all:
    - pattern: $X.$FIELD
    - not:
        any:
          - pattern: $X.clear_api_key
          - pattern: $X.has_stored_api_key
    # ``store.hash_password(...)`` 等方法名不是凭据字段;仅排除 call.function,
    # call arguments 中的 ``body.new_password`` 仍会命中。
    - not:
        inside:
          kind: call
          field: function
constraints:
  FIELD:
    regex: "^[a-z][a-z0-9_]+_(password|passwd|pwd|api_key|token)$"
