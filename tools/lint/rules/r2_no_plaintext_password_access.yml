# R2 红线(契约 §4):业务代码禁止直接访问明文凭据字段
# 必须走 SecretStore.reveal_secret(ref) 取明文,且 ref 只能是 SecretRef
#
# 扫描整个 app/**。仅三类必须物化明文的契约 seam 免检:
#   - dbclients/:SecretStore reveal 后传给数据库驱动
#   - secretstore/:加密/哈希原语的实现边界
#   - bootstrap/:连接 PG 前从文件读取 bootstrap secret
# 其它必要的单行边界必须用带 rule id 的 ast-grep-ignore 显式审计。
# 动态 key(如 obj[field])无法静态证明是凭据 key,本规则不承诺拦截。
id: r2-no-plaintext-password-access
language: python
severity: error
message: |
  R2 红线违规:业务代码直接访问明文凭据字段。
  请改为 SecretStore.reveal_secret(secret_ref)。
  见契约 §4 R2 / §7.4 SecretStore。
files:
  - "app/**/*.py"
ignores:
  - "app/dbclients/**/*.py"
  - "app/infrastructure/secretstore/**/*.py"
  - "app/infrastructure/bootstrap/**/*.py"
rule:
  any:
    # ds["password"] / ds["passwd"] / ds["pwd"]
    - pattern: $X["password"]
    - pattern: $X["passwd"]
    - pattern: $X["pwd"]
    # ds.get("password") / 等
    - pattern: $X.get("password")
    - pattern: $X.get("passwd")
    - pattern: $X.get("pwd")
    # ds["api_key"] / ds["token"] 同样禁止
    - pattern: $X["api_key"]
    - pattern: $X["token"]
    - pattern: $X.get("api_key")
    - pattern: $X.get("token")
    # ds.password / ds.api_key / ds.token 等属性访问
    - pattern: $X.password
    - pattern: $X.passwd
    - pattern: $X.pwd
    - pattern: $X.api_key
    - pattern: $X.token
    # getattr(ds, "password") 等字面凭据属性
    - pattern: getattr($X, "password")
    - pattern: getattr($X, "passwd")
    - pattern: getattr($X, "pwd")
    - pattern: getattr($X, "api_key")
    - pattern: getattr($X, "token")
