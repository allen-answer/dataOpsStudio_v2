# R2 红线(契约 §4):services/ 与 api/ 禁止直接访问明文密码字段
# 必须走 SecretStore.reveal_secret(ref) 取明文,且 ref 只能是 SecretRef
#
# 命中即 CI fail。例外:tests/(测试可以直接构造 mock 数据)
id: r2-no-plaintext-password-access
language: python
severity: error
message: |
  R2 红线违规:services/ 或 api/ 直接持有明文密码字段。
  请改为 SecretStore.reveal_secret(secret_ref)。
  见契约 §4 R2 / §7.4 SecretStore。
files:
  - "app/services/**/*.py"
  - "app/api/**/*.py"
rule:
  any:
    # ds["password"] / ds["passwd"] / ds["pwd"]
    - pattern: $X["password"]
    - pattern: $X["passwd"]
    - pattern: $X["pwd"]
    # ds.get("password") / 等
    - pattern: $X.get("password")
    - pattern: $X.get("passwd")
    - pattern: $X.get("pwd")
    # ds["api_key"] / ds["token"] 同样禁止
    - pattern: $X["api_key"]
    - pattern: $X["token"]
    - pattern: $X.get("api_key")
    - pattern: $X.get("token")
