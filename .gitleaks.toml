# gitleaks 配置(R8 红线 + 通用 secret 扫描)
# CI 用 gitleaks-action@v2 强制;本地可选
#
# extend default rules(覆盖 ~120 个常见 secret patterns)
# + 自定义:配置文件明文 password 字段

[extend]
useDefault = true

# ─── R8 自定义规则:配置文件 / yaml / toml 中明文 password 字段 ───
# 注:Go RE2 不支持 lookahead,占位符排除走 [rules.allowlist] 的 regexes
[[rules]]
id = "r8-plaintext-password-in-config"
description = "R8 红线:配置文件禁明文 password / secret / api_key 字段"
regex = '''(?i)(password|passwd|pwd|secret|api[_-]?key|token)\s*[:=]\s*["']?[A-Za-z0-9+/=_-]{8,}'''
path = '''(?i)\.(ya?ml|json|toml|conf|cfg|ini|env|properties)$'''
tags = ["R8", "config-file", "secret"]

[rules.allowlist]
description = "占位符 / env var / 测试假值 不是 leak"
regexTarget = "match"
regexes = [
    '''\$\{''',                                          # ${VAR} placeholder
    '''(?i)(xxx|placeholder|changeme|redacted|none|null)''',
    '''(?i)(test_pwd|hunter2|secret_pwd|leak_value|leak1|leak2|fakepwd)''',  # 测试假值
    '''https://''',                                      # 包 URL 含 hash
]

# ─── 全局例外 ───
[allowlist]
description = "lock 文件 / 文档 / 测试 fixture / venv / lint 规则文件 不参与扫描"
paths = [
    "uv\\.lock",
    "\\.venv/",
    ".*\\.md$",                  # docs 含 password 字面说明
    "tests/.*",                  # 测试 fixture 含假凭据
    "tools/lint/.*",             # ast-grep 规则说明
    "docs/.*",
    ".*\\.lock$",
]
