# 元数据 PG 容器(dev / Step 1.6 验证 alembic 迁移用)。
#
# ★ 隔离 1.x:容器名 / volume / network 全部 v2- 前缀,绝不复用 1.x 资源
# ★ 端口 127.0.0.1:15432(loopback only)—— 避开 1.x 5432 / 8010 / daily-report-bot 8000
# ★ POSTGRES_PASSWORD 走 Bootstrap Secret 文件(R8 红线:配置文件不写明文凭据)。
#   生成:uv run python -m app.launcher bootstrap init
#
# 用法:make pg-up / make alembic-up / make pg-psql / make pg-down

name: dataops-v2-dev

services:
  pg:
    image: postgres:16-alpine
    container_name: dataops-v2-pg
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_USER: dataops
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_app_password
      POSTGRES_DB: dataops
    secrets:
      - pg_app_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataops -d dataops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
    name: dataops-v2-pgdata

secrets:
  pg_app_password:
    file: ../config/secrets/pg_app_password
