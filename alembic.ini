[alembic]
script_location = app/db/migrations
prepend_sys_path = .
version_path_separator = os

# sqlalchemy.url intentionally empty: env.py reads the real URL from the
# DATAOPS_DATABASE_URL environment variable. No plaintext credentials in
# config files (redline R8). NOTE: keep this file ASCII-only -- Alembic reads
# it with the OS locale encoding (GBK/cp936 on zh-CN Windows), so non-ASCII
# bytes here break `alembic upgrade` off the UTF-8 path.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
