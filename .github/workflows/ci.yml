# CI —— 红线 R1-R9 + 单测 + alembic 真实迁移
# 契约 §10.5 + §4
#
# R9 配套:CI 矩阵只跑 PG service,不跑 SQLite(2.0 永不支持)

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 同一分支/PR 的新 push 自动取消进行中的旧 run,避免过时 run 空跑占 CI 分钟。
# main 分支例外:cancel-in-progress=false,合并链的 run 排队跑完不互相取消。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  UV_VERSION: "0.11.16"

jobs:
  # ─── R1/R3/R5 + 代码风格 + AST 红线 ───
  lint:
    name: Lint & Format & Type & AST Red Lines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync deps (all groups)
        run: uv sync --locked --all-groups

      # R1 / R3:driver/crypto import 越界(ruff TID251 banned-api)
      - name: ruff check (R1/R3 banned-api)
        run: uv run ruff check app tests tools

      - name: ruff format check
        run: uv run ruff format --check app tests tools

      - name: mypy strict
        run: uv run mypy app tests

      # R2 / R6:AST 模式红线(密码字段访问 / cursor 字段)
      # severity: error 的规则命中后 ast-grep 自动 exit 1
      - name: ast-grep red lines (R2/R6)
        run: uv run sg scan --config tools/lint/sgconfig.yml

  # ─── R8:gitleaks(secret 扫描 + 配置文件明文 password) ───
  # 直接下二进制,不用 gitleaks-action(后者私有仓需付费 license)
  gitleaks:
    name: Secret Scan (R8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # gitleaks 需要全 history

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION="8.21.2"
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: gitleaks detect
        run: gitleaks detect --redact --no-banner --config .gitleaks.toml --exit-code 1

  # ─── 单元测试 + 真实 PG alembic 迁移 ───
  # R9 配套:只在 PostgreSQL service 上跑,不跑 SQLite
  test:
    name: Unit Tests & Alembic Migration (PG 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dataops
          POSTGRES_PASSWORD: ci_test_pwd_not_real_secret
          POSTGRES_DB: dataops
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync deps
        run: uv sync --locked --all-groups

      # 真实 alembic 迁移(契约 §10.5 each PR 验证 schema 可迁)
      - name: alembic upgrade head
        env:
          PGPASSWORD: ci_test_pwd_not_real_secret
          DATAOPS_DATABASE_URL: postgresql+psycopg://dataops@localhost:15432/dataops
        run: uv run alembic upgrade head

      - name: alembic check (no schema drift)
        env:
          PGPASSWORD: ci_test_pwd_not_real_secret
          DATAOPS_DATABASE_URL: postgresql+psycopg://dataops@localhost:15432/dataops
        run: uv run alembic check

      # R4 DB 层防御 smoke:insert bootstrap kind 应被拒
      - name: R4 DB CHECK smoke (master_key INSERT must FAIL)
        env:
          PGPASSWORD: ci_test_pwd_not_real_secret
        run: |
          set +e
          OUTPUT=$(psql -h localhost -p 15432 -U dataops -d dataops -c \
            "INSERT INTO secret_refs (ref, kind, ciphertext) VALUES ('test_r4', 'master_key', '\x00');" 2>&1)
          EXIT=$?
          set -e
          if [ "$EXIT" -eq 0 ]; then
            echo "R4 violation: master_key kind INSERT was NOT rejected by DB CHECK"
            exit 1
          fi
          echo "$OUTPUT" | grep -q "violates check constraint" || { echo "Unexpected error type"; exit 1; }
          echo "OK: R4 DB CHECK rejected master_key INSERT"

      # 包含 R4/R5/R6/R7 的 Python 层校验(test_redlines.py + test_redaction.py 等)
      - name: pytest unit + contract
        env:
          PGPASSWORD: ci_test_pwd_not_real_secret
          DATAOPS_TEST_PG_URL: postgresql+psycopg://dataops@localhost:15432/dataops
        run: uv run pytest tests/unit tests/contract -v

  # ─── R6 integration:真 MySQL service 验连接释放 + spool 独立可读 ───
  # 跑 @pytest.mark.integration 的 R6 测试(test_mysql_adapter.py 里那条):
  #   - execute_select 后 Threads_connected 不增长(连接释放)
  #   - monkeypatch pymysql.connect 失败,fetch_range 仍能读 spool
  #     (证明数据落地本地 parquet,不在 cursor)
  # 用临时 mysql:8.0 service container,跑完销毁。每次 push/PR 自动守 R6。
  mysql-integration:
    name: MySQL Integration (R6)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_test_pwd_not_real_secret
          MYSQL_DATABASE: app
          MYSQL_USER: dataops
          MYSQL_PASSWORD: ci_test_pwd_not_real_secret
        ports:
          - 3306:3306
        # MySQL 8 冷启动 ~30s。health-start-period 给 30s 宽限期(此期间 unhealthy
        # 不计 retry),其后每 10s ping,20 retry = 最多再等 200s,足够。
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci_test_pwd_not_real_secret"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync deps
        run: uv sync --locked --all-groups

      # 双重保险:GitHub Actions service health check 已等 MySQL ready,
      # 但本步再 ping 一次确认 + 留可见日志(健康检查日志在 service 容器里,
      # job 日志看不到,这里再 ping 暴露给 job log)
      - name: Wait for MySQL ready
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -uroot -pci_test_pwd_not_real_secret --silent 2>/dev/null; then
              echo "MySQL ready after ${i} attempts"
              mysql -h 127.0.0.1 -uroot -pci_test_pwd_not_real_secret -e "SHOW DATABASES; SELECT VERSION();" 2>/dev/null
              exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready in 60s"; exit 1

      - name: pytest -m integration (R6 hard evidence)
        env:
          DATAOPS_TEST_MYSQL_HOST: 127.0.0.1
          DATAOPS_TEST_MYSQL_PORT: "3306"
          DATAOPS_TEST_MYSQL_USER: dataops
          DATAOPS_TEST_MYSQL_PASSWORD: ci_test_pwd_not_real_secret
          DATAOPS_TEST_MYSQL_DATABASE: app
        run: uv run pytest -m integration -v

  # ─── PG queue 并发硬证据:PostgresJobBackend FOR UPDATE SKIP LOCKED 真验证 ───
  # 跑 tests/integration/test_postgres_jobbackend.py 4 个并发 / 故障场景:
  #   - 8 worker thread × 25 job 并发 claim → 每个 job 恰好执行一次
  #     (★ PG queue 关键性质:FOR UPDATE SKIP LOCKED 不重复)
  #   - 5 reaper thread × 12 stale job → sum(requeued) == 12 无双计
  #     (★ Reaper 并发安全:CTE + FOR UPDATE SKIP LOCKED 原子)
  #   - retry budget=0 stale → 直接 failed
  #   - 旧 worker 迟到 complete → SQL ownership 条件拒(F1 不变量)
  # 与 mysql-integration 并行,独立 postgres:16-alpine service container。
  pg-integration:
    name: PG Queue Concurrency (T1 hard evidence)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dataops
          POSTGRES_PASSWORD: ci_test_pwd_not_real_secret
          POSTGRES_DB: dataops
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync deps
        run: uv sync --locked --all-groups

      # PG service health check 已等 ready,这里再 ping 暴露版本到 job log
      - name: Wait for PG ready
        env:
          PGPASSWORD: ci_test_pwd_not_real_secret
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 15432 -U dataops -d dataops -q 2>/dev/null; then
              echo "PG ready after ${i} attempts"
              psql -h 127.0.0.1 -p 15432 -U dataops -d dataops -c "SELECT version();" 2>/dev/null | head -3
              exit 0
            fi
            sleep 2
          done
          echo "PG did not become ready in 60s"; exit 1

      - name: pytest tests/integration/ (PG queue concurrency + reaper + ownership)
        env:
          # 测试用 metadata.create_all 自建 schema,直接给 URL 即可。
          # _pg_engine_or_skip 优先读 DATAOPS_TEST_PG_URL,fallback DATAOPS_DATABASE_URL。
          DATAOPS_TEST_PG_URL: postgresql+psycopg://dataops:ci_test_pwd_not_real_secret@127.0.0.1:15432/dataops
        run: uv run pytest -m integration tests/integration/ -v

  # ─── e2e 双服务硬证据:契约 §5 验收路径(login → datasource → /test → SQL → /result) ───
  # 跑 tests/integration/test_e2e_acceptance.py(需要 PG + MySQL 都在)。
  # 这条 e2e 是 T4 + 2.0.0 骨架立住的核心判据 —— 前面 mysql-integration /
  # pg-integration 各只跑一半服务,e2e 被双 skip,等于契约 §5 验收从没真跑过。
  e2e-integration:
    name: E2E Acceptance (contract §5 hard evidence)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dataops
          POSTGRES_PASSWORD: ci_test_pwd_not_real_secret
          POSTGRES_DB: dataops
        ports:
          - 15432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_test_pwd_not_real_secret
          MYSQL_DATABASE: app
          MYSQL_USER: dataops
          MYSQL_PASSWORD: ci_test_pwd_not_real_secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci_test_pwd_not_real_secret"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Sync deps
        run: uv sync --locked --all-groups

      - name: Wait for PG ready
        env:
          PGPASSWORD: ci_test_pwd_not_real_secret
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 15432 -U dataops -d dataops -q 2>/dev/null; then
              echo "PG ready after ${i} attempts"; exit 0
            fi
            sleep 2
          done
          echo "PG did not become ready in 60s"; exit 1

      - name: Wait for MySQL ready
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -uroot -pci_test_pwd_not_real_secret --silent 2>/dev/null; then
              echo "MySQL ready after ${i} attempts"; exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready in 60s"; exit 1

      - name: pytest e2e acceptance (real PG + real MySQL)
        env:
          DATAOPS_TEST_PG_URL: postgresql+psycopg://dataops:ci_test_pwd_not_real_secret@127.0.0.1:15432/dataops
          DATAOPS_TEST_MYSQL_HOST: 127.0.0.1
          DATAOPS_TEST_MYSQL_PORT: "3306"
          DATAOPS_TEST_MYSQL_USER: dataops
          DATAOPS_TEST_MYSQL_PASSWORD: ci_test_pwd_not_real_secret
          DATAOPS_TEST_MYSQL_DATABASE: app
        run: uv run pytest tests/integration/test_e2e_acceptance.py -v

  # ─── Cold-start hard evidence(T6 portable launcher) ────────────────────────
  # 跑 docs/deployment/quickstart.md 的 §1-§8 全链路:
  #   apt install pg-16 → launcher bootstrap init → pg-up → alembic-up →
  #   admin create → up(background)→ login → datasource → SELECT 1+1 →
  #   断言 columns[0].name=='r' && rows[0].values[0]==2
  cold-start:
    name: Cold-start (T6 hard evidence)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_test_pwd_not_real_secret
          MYSQL_DATABASE: app
          MYSQL_USER: dataops
          MYSQL_PASSWORD: ci_test_pwd_not_real_secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pci_test_pwd_not_real_secret"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install PostgreSQL 16 binaries (apt)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-16 postgresql-client-16
          # 释放 apt 自起的 cluster,launcher 自己管 15432
          sudo pg_ctlcluster 16 main stop 2>/dev/null || true
          sudo systemctl disable --now postgresql.service 2>/dev/null || true

      - name: uv sync (Prereq F1)
        run: uv sync --locked --all-groups

      - name: launcher doctor (must pass all checks)
        env:
          DATAOPS_HOME: ${{ github.workspace }}/.dataops-runtime
          DATAOPS_PG_BIN_DIR: /usr/lib/postgresql/16/bin
        run: uv run python -m app.launcher --root "$DATAOPS_HOME" --pg-bin-dir "$DATAOPS_PG_BIN_DIR" doctor

      - name: launcher bootstrap init
        env:
          DATAOPS_HOME: ${{ github.workspace }}/.dataops-runtime
          DATAOPS_PG_BIN_DIR: /usr/lib/postgresql/16/bin
        run: uv run python -m app.launcher --root "$DATAOPS_HOME" --pg-bin-dir "$DATAOPS_PG_BIN_DIR" bootstrap init

      - name: launcher pg-up
        env:
          DATAOPS_HOME: ${{ github.workspace }}/.dataops-runtime
          DATAOPS_PG_BIN_DIR: /usr/lib/postgresql/16/bin
        run: uv run python -m app.launcher --root "$DATAOPS_HOME" --pg-bin-dir "$DATAOPS_PG_BIN_DIR" pg-up

      - name: launcher alembic-up
        env:
          DATAOPS_HOME: ${{ github.workspace }}/.dataops-runtime
          DATAOPS_PG_BIN_DIR: /usr/lib/postgresql/16/bin
        run: uv run python -m app.launcher --root "$DATAOPS_HOME" --pg-bin-dir "$DATAOPS_PG_BIN_DIR" alembic-up

      - name: launcher admin create
        env:
          DATAOPS_HOME: ${{ github.workspace }}/.dataops-runtime
          DATAOPS_PG_BIN_DIR: /usr/lib/postgresql/16/bin
        run: |
          uv run python -m app.launcher --root "$DATAOPS_HOME" --pg-bin-dir "$DATAOPS_PG_BIN_DIR" admin create \
            --username admin \
            --password 'ci_cold_start_not_real_secret' \
            --project-name Default

      - name: launcher up (background) + healthz
        env:
          DATAOPS_HOME: ${{ github.workspace }}/.dataops-runtime
          DATAOPS_PG_BIN_DIR: /usr/lib/postgresql/16/bin
        run: |
          nohup uv run python -m app.launcher --root "$DATAOPS_HOME" --pg-bin-dir "$DATAOPS_PG_BIN_DIR" up \
            > "$DATAOPS_HOME/logs/up.log" 2>&1 &
          echo "$!" > "$DATAOPS_HOME/up.pid"
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8020/healthz 2>/dev/null; then
              echo "API ready after ${i} attempts"; exit 0
            fi
            sleep 2
          done
          echo "API did not become ready in 60s"; exit 1

      - name: §6-§8 cold-start hard evidence (SELECT 1+1 → assert r=2)
        run: |
          set -e
          API=http://127.0.0.1:8020/api
          TOKEN=$(curl -sS -X POST $API/auth/login \
            -H 'content-type: application/json' \
            -d '{"username":"admin","password":"ci_cold_start_not_real_secret"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          PROJECT_ID=$(curl -sS $API/projects -H "authorization: Bearer $TOKEN" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['id'])")
          BODY=$(python3 -c "import json; print(json.dumps({'project_id':'$PROJECT_ID','name':'ci-mysql','db_type':'mysql','host':'127.0.0.1','port':3306,'username':'dataops','password':'ci_test_pwd_not_real_secret','database':'app','environment':'dev','extra':{}}))")
          DS_ID=$(curl -sS -X POST $API/datasources \
            -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' -d "$BODY" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          TEST=$(curl -sS -X POST "$API/datasources/$DS_ID/test" -H "authorization: Bearer $TOKEN")
          echo "test_connection: $TEST"
          OK=$(echo "$TEST" | python3 -c "import sys,json; print(json.load(sys.stdin)['ok'])")
          [ "$OK" = "True" ] || { echo "test_connection not ok"; exit 1; }

          EX=$(curl -sS -X POST $API/sql/execute -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            -d "{\"datasource_id\":\"$DS_ID\",\"sql\":\"SELECT 1+1 AS r\",\"params\":{}}")
          JOB_ID=$(echo "$EX" | python3 -c "import sys,json; print(json.load(sys.stdin)['job_id'])")
          STATUS=""
          for i in $(seq 1 30); do
            STATUS=$(curl -sS "$API/jobs/$JOB_ID" -H "authorization: Bearer $TOKEN" \
              | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
            [ "$STATUS" = "success" ] && break
            [ "$STATUS" = "failed" ] && { echo "job failed"; exit 1; }
            [ "$STATUS" = "cancelled" ] && { echo "job cancelled"; exit 1; }
            sleep 1
          done
          [ "$STATUS" = "success" ] || { echo "job did not finish in 30s"; exit 1; }

          RES=$(curl -sS "$API/jobs/$JOB_ID/result?offset=0&limit=10" -H "authorization: Bearer $TOKEN")
          echo "$RES" | python3 -m json.tool
          COL=$(echo "$RES" | python3 -c "import sys,json; print(json.load(sys.stdin)['columns'][0]['name'])")
          VAL=$(echo "$RES" | python3 -c "import sys,json; print(json.load(sys.stdin)['rows'][0]['values'][0])")
          [ "$COL" = "r" ] || { echo "expected columns[0].name=r, got '$COL'"; exit 1; }
          [ "$VAL" = "2" ] || { echo "expected rows[0].values[0]=2, got '$VAL'"; exit 1; }
          echo "::notice::Cold-start §1-§8 verified: columns[0].name=r, rows[0].values[0]=2"

      - name: Dump logs on failure
        if: failure()
        env:
          DATAOPS_HOME: ${{ github.workspace }}/.dataops-runtime
        run: |
          echo "==up.log=="; cat "$DATAOPS_HOME/logs/up.log" 2>/dev/null || true
          echo "==api.log=="; cat "$DATAOPS_HOME/logs/api.log" 2>/dev/null || true
          echo "==worker.log=="; cat "$DATAOPS_HOME/logs/worker.log" 2>/dev/null || true
          echo "==pg.log=="; cat "$DATAOPS_HOME/logs/pg.log" 2>/dev/null || true

  # ─── 前端 build 底线(T7 phase 1+) ─────────────────────────────────
  # 前端进 git 就该有 CI 守:vue-tsc + vite build 能不能编译过。
  # 跟后端红线一个道理 —— build 是最低线,e2e 是另一回事。
  # ─── Compose form hard evidence(contract §5"docker compose 跑通同样流程")────
  # 守护 #35 交付的 compose 形态不回归纸面:build → secrets-init → pg → migrate →
  # api+worker → healthz → 真登录 → license/projects 鉴权链路。
  # 完整 SELECT/spool 链路由 cold-start job(portable 形态)覆盖,此处不重复拉 MySQL。
  compose-stack:
    name: Compose form (§5 hard evidence)
    runs-on: ubuntu-latest
    env:
      DATAOPS_BUILD_VERSION: 2.0.1
      DATAOPS_BUILD_COMMIT: ${{ github.sha }}
      DATAOPS_IMAGE_VERSION: 2.0.1-ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v6

      - name: Build stack image
        run: docker compose -f docker/compose.dataops.yml build

      - name: Bring up stack
        run: docker compose -f docker/compose.dataops.yml up -d

      - name: Wait for API healthz
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:18020/healthz >/dev/null; then
              echo "API ready after ${i} attempts"; exit 0
            fi
            sleep 3
          done
          echo "API not ready in 90s"
          docker compose -f docker/compose.dataops.yml ps
          docker compose -f docker/compose.dataops.yml logs --tail 60
          exit 1

      - name: Verify API build identity and API/worker image parity
        run: |
          curl -fs http://127.0.0.1:18020/api/version \
            | jq -e --arg sha "$GITHUB_SHA" --arg image "$DATAOPS_IMAGE_VERSION" \
              '.commit == $sha and .image_version == $image'
          API_IMAGE_ID=$(docker inspect dataops-v2-stack-api --format '{{.Image}}')
          WORKER_IMAGE_ID=$(docker inspect dataops-v2-stack-worker --format '{{.Image}}')
          test "$API_IMAGE_ID" = "$WORKER_IMAGE_ID"
          IMAGE_REVISION=$(docker image inspect "dataops-studio:$DATAOPS_IMAGE_VERSION" \
            --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')
          test "$IMAGE_REVISION" = "$GITHUB_SHA"
          echo "API and worker use the same image: ${API_IMAGE_ID:0:19}"

      - name: Admin create + authenticated §5 sample (login / license / projects)
        run: |
          ADMIN_PW=$(openssl rand -base64 15)
          echo "::add-mask::$ADMIN_PW"
          docker compose -f docker/compose.dataops.yml run --rm admin-create \
            --username admin --password "$ADMIN_PW" --project-name Default | grep -iv password
          TOKEN=$(curl -sf -X POST http://127.0.0.1:18020/api/auth/login \
            -H 'content-type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"$ADMIN_PW\"}" | jq -r .access_token)
          test -n "$TOKEN" && test "$TOKEN" != "null"
          curl -sf http://127.0.0.1:18020/api/license/status \
            -H "authorization: Bearer $TOKEN" | jq -e '.mode == "trial"'
          curl -sf http://127.0.0.1:18020/api/projects \
            -H "authorization: Bearer $TOKEN" | jq -e 'length >= 1'
          echo "compose form §5 sample chain OK"

      - name: Logs on failure
        if: failure()
        run: docker compose -f docker/compose.dataops.yml logs --tail 120

      - name: Teardown
        if: always()
        run: docker compose -f docker/compose.dataops.yml down -v

  frontend-build:
    name: Frontend Build (T7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: npm ci (clean install)
        run: npm ci
        working-directory: frontend

      - name: vue-tsc + vite build
        run: npm run build
        working-directory: frontend

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Playwright e2e
        run: npm run test:e2e
        working-directory: frontend

  # ─── 治理结构同步守护(AGENTS.md == CLAUDE.md,除首行) ───────────────
  # 两份是 agent 入口宪法,内容除标题外必须一字一致 —— 任何一边改了对面没改,
  # 这道闸立刻红。防 review 漏看导致两边规则漂移。
  agents-doc-sync:
    name: Agents Doc Sync (AGENTS.md == CLAUDE.md)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: diff AGENTS.md vs CLAUDE.md (skip first line title)
        run: |
          if ! diff <(tail -n +2 AGENTS.md) <(tail -n +2 CLAUDE.md) > /dev/null; then
            echo "::error::AGENTS.md 和 CLAUDE.md 内容不一致(除首行标题外)。"
            echo "::error::两份必须同步;改其中一个必须同步另一个。"
            echo "─── diff ───"
            diff <(tail -n +2 AGENTS.md) <(tail -n +2 CLAUDE.md) | head -80
            exit 1
          fi
          echo "✓ AGENTS.md ≡ CLAUDE.md (除首行标题)"
