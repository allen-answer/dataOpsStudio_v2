version: 2

# Stability hold: keep reproducible lockfiles unchanged until the current release is stable.
# GitHub documents a zero limit as disabling version-update PRs while retaining security updates.
updates:
  - package-ecosystem: "uv"
    directory: "/"
    open-pull-requests-limit: 0
    schedule:
      interval: "monthly"
    groups:
      python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/frontend"
    open-pull-requests-limit: 0
    schedule:
      interval: "monthly"
    groups:
      frontend-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 0
    schedule:
      interval: "monthly"
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
