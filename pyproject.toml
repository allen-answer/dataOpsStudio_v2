[project]
name = "dataops-studio"
version = "2.0.1"
description = "DataOpsStudio 2.0 — database workbench for data engineers & DBAs"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "allen-answer" }]

dependencies = [
    # Web
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32",
    # Data validation & config
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6",
    # Metadata DB (PostgreSQL only — see contract §1 R9)
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13",
    "psycopg[binary]>=3.2,<4",
    # Observability
    "structlog>=24.4",
    "prometheus-client>=0.21",
    # SQL & data
    "sqlglot>=25.0",
    "pyarrow>=18,<25",
    "numpy>=1.26.0",
    # File-source readers — C-1 file compare(app/domain/readers/,非 DB 驱动)
    "openpyxl>=3.1",
    # Secret crypto — import allowed ONLY in app/infrastructure/secretstore/ (R3)
    "cryptography>=43,<49",
    "bcrypt>=4.2,<6",
    # License signature verification — Ed25519
    "pynacl>=1.5,<2",
    "pymysql>=1.1",
    # DM(达梦)driver — import 仅允许在 app/dbclients/(R1)。
    # cp312 manylinux + win_amd64 wheel 齐全(可 uv/pip 装,无需本地 DM 客户端)。
    "dmPython>=2.5",
    "pyjwt>=2.13.0",
    "pyotp>=2.9.0",
    # Cron 表达式解析 — Workflow schedule tick(PR-4b / ADR-0009 §1)。
    # 纯 Python parser(非调度框架/进程),只解析 cron 求上/下一触发点;
    # ADR-0009 §1 拒绝的是 APScheduler(独立调度进程),进程内 tick 仍自写。
    "croniter>=3.0",
    # Workflow cron 全局时区:跨 Windows/Unix 解析服务器本地 IANA ZoneInfo。
    "tzlocal>=5.4",
]

[project.optional-dependencies]
# DB2 driver — 刻意不进主 dependencies:pip 装 ibm_db 会拉 ~30MB clidriver,
# 离线/portable 部署是最高失败率项(1.x 同款取舍,1.x 直接注释掉了它)。
# adapter 延迟 import,缺驱动时报错信息指引安装。import 仅允许在 app/dbclients/(R1)。
db2 = ["ibm_db>=3.2"]
# Oracle driver — python-oracledb thin mode(纯 Python,免装 Oracle Instant Client;
# cp312 wheel 齐全)。刻意作为 optional extra(Preview 档,非默认交付),adapter
# 延迟 import,缺驱动时报错信息指引安装。import 仅允许在 app/dbclients/(R1)。
oracle = ["oracledb>=2.0"]

[project.urls]
Repository = "https://github.com/allen-answer/dataOpsStudio_v2"

# PEP 735 dependency groups — uv supports natively
[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    # ast-grep CLI(R2/R6 等需要 AST 模式匹配的红线)
    "ast-grep-cli>=0.30",
]
test = [
    "pytest>=8",
    "pytest-cov>=5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ─────────────────────────────────────────────────────────────────────────────
# uv config
# ─────────────────────────────────────────────────────────────────────────────
[tool.uv]
# uv.lock 提交进 git;portable 形态可复现构建依赖此 lockfile

# Index 选用 Aliyun PyPI 镜像(公共 CDN,全球可达)。
# 理由:hosted 部署目标是腾讯云 CVM(契约 B14),国内 PyPI 直连
# 慢到 ~11KB/s,Aliyun/Tencent mirror 都是几 MB/s。Aliyun 选 universal
# 也能 fallback 海外。任何 contributor 都能从此 mirror 拉到与 PyPI
# 同 hash 的 wheel(CDN 镜像,内容一致)。
# 若日后做国际版 hosted,可改回 PyPI 或加 extra-index。
[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

# ─────────────────────────────────────────────────────────────────────────────
# ruff — formatter + linter + import policy (R1/R3 红线)
# ─────────────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "TID",           # flake8-tidy-imports —— R1/R3 红线
    "RUF",
]

# R1/R3 红线:数据库驱动 + 加密原语的 banned-api。
# 命中后在指定目录之外 import 即 fail。
# production 与 tests 的合法例外都必须在实际 import 行精确声明并由 redline test 审计。
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"psycopg".msg                  = "R1: PG 驱动只允许在 app/dbclients/ 或 app/infrastructure/db/、app/db/migrations/ import"
"oracledb".msg                 = "R1: Oracle 驱动只允许在 app/dbclients/ import"
"pymysql".msg                  = "R1: MySQL 驱动只允许在 app/dbclients/ import"
"dmPython".msg                 = "R1: DM 驱动只允许在 app/dbclients/ import"
"ibm_db".msg                   = "R1: DB2 驱动只允许在 app/dbclients/ import"
"ibm_db_dbi".msg               = "R1: DB2 驱动(DB-API wrapper)只允许在 app/dbclients/ import"
"cryptography.fernet".msg      = "R3: Fernet 只允许在 app/infrastructure/secretstore/ import"
"cryptography.hazmat".msg      = "R3: cryptography.hazmat 只允许在 app/infrastructure/secretstore/ 或 app/infrastructure/license/ import"
"bcrypt".msg                   = "R3: bcrypt 只允许在 app/infrastructure/secretstore/ import"
"nacl".msg                     = "R3: PyNaCl 只允许在 app/infrastructure/license/ import"

# 禁止目录级 TID251 blanket;本空表由 redline test 锁定。
[tool.ruff.lint.per-file-ignores]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─────────────────────────────────────────────────────────────────────────────
# mypy
# ─────────────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
exclude = ["app/db/migrations/versions/"]

# croniter 未随包发 py.typed(无 stub),strict 下 import 会报 import-untyped。
[[tool.mypy.overrides]]
module = ["croniter", "croniter.*"]
ignore_missing_imports = true

# openpyxl 不发布 type stubs(无 py.typed);domain readers 需 import 它。
[[tool.mypy.overrides]]
module = ["openpyxl.*"]
ignore_missing_imports = true

# ─────────────────────────────────────────────────────────────────────────────
# pytest
# ─────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "contract: 接口契约测试(Codex 实现各 Protocol 后启用)",
    "e2e: 端到端验收测试(契约 §5 验收路径,2.0.0 骨架完成才转绿)",
    "integration: 需要外部服务/真实数据库的手动集成测试,默认缺 env skip",
    "dm_integration: 需要持牌 DM 真库的 Session Broker 手动门控套件,不进 CI",
    "slow: 慢测试,默认跑;CI 可单独标记隔离",
]
